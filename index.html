<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafaf8">
<title>Weets</title>
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<style>
:root{--bg:#fafaf8;--surface:#fff;--ink:#141414;--mute:#6c6c66;--faint:#a3a39c;--line:#e8e7e2;--soft:#f1f0ec;--accent:#2156d9;--accent-soft:#e8eefc;--danger:#c23a2e;--shadow:0 1px 2px rgba(20,20,20,.04),0 8px 28px -10px rgba(20,20,20,.14);--r:20px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root[data-theme=dark]{--bg:#0d0d0c;--surface:#171716;--ink:#f1f0ec;--mute:#9a9a93;--faint:#5f5f5a;--line:#262624;--soft:#1e1e1c;--accent:#86a8ff;--accent-soft:#1a2238;--danger:#ff7b6e;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.7)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0c;--surface:#171716;--ink:#f1f0ec;--mute:#9a9a93;--faint:#5f5f5a;--line:#262624;--soft:#1e1e1c;--accent:#86a8ff;--accent-soft:#1a2238;--danger:#ff7b6e;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -10px rgba(0,0,0,.7)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
/* ---------- splash & loading ---------- */
#splash,#loading{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .55s ease,visibility .55s}
#loading{z-index:99;flex-direction:column;gap:22px}
#splash.out,#loading.out{opacity:0;visibility:hidden}
.wordmark{width:min(62vw,300px);height:auto;overflow:visible}
.wordmark path{fill:none;stroke:var(--ink);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.6,.05,.25,1) forwards}
.wordmark path:nth-child(2){animation-delay:.18s}.wordmark path:nth-child(3){animation-delay:.34s}.wordmark path:nth-child(4){animation-delay:.5s}.wordmark path:nth-child(5){animation-delay:.64s}
@keyframes draw{to{stroke-dashoffset:0}}
.logo-load{width:min(58vw,260px);overflow:visible}
.logo-load path{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.logo-load .ghost{stroke-opacity:.1}
.logo-load .flow{stroke-dasharray:.22 1;stroke-dashoffset:0;animation:flow 1.9s linear infinite}
@keyframes flow{from{stroke-dashoffset:1.22}to{stroke-dashoffset:0}}
.load-note{font-size:13px;color:var(--mute);letter-spacing:.02em;min-height:20px}
/* ---------- kerangka ---------- */
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--sat)}
header{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 6px;flex:none}
header .btn{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
header .btn:active{background:var(--soft)}
header .mark{height:20px;width:auto}
header .mark path{fill:none;stroke:var(--ink);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.page{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
/* ---------- obrolan ---------- */
#msgs{padding-top:8px;padding-bottom:24px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 24px 12vh;text-align:center}
.empty svg.big{width:min(46vw,170px);overflow:visible}
.empty svg.big path{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.empty h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.empty p{margin:0;color:var(--mute);font-size:15px;max-width:30ch}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.sug{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink)}
.sug:active{background:var(--soft)}
.m{margin:18px 0;display:flex;flex-direction:column}
.m.user{align-items:flex-end}
.m.user .b{background:var(--soft);border-radius:20px 20px 6px 20px;padding:10px 15px;max-width:86%;white-space:pre-wrap;word-break:break-word}
.m .b{font-size:16px}
.m.ai .b{width:100%;word-break:break-word}
.b p{margin:0 0 .75em}.b p:last-child{margin-bottom:0}
.b ul,.b ol{margin:.3em 0 .8em;padding-left:1.25em}.b li{margin:.15em 0}
.b code{font:13.5px var(--mono);background:var(--soft);padding:.1em .38em;border-radius:6px}
.b pre{position:relative;background:var(--soft);border-radius:14px;padding:14px;overflow:auto;margin:.5em 0 .9em;font:13px/1.55 var(--mono)}
.b pre code{background:none;padding:0}
.b pre .run{position:absolute;top:8px;right:8px;font:12px var(--font);color:var(--mute);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px}
.runout{font:12.5px var(--mono);color:var(--mute);white-space:pre-wrap;margin:-.4em 0 .9em}
a.lnk{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;word-break:break-all}
a.cite{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;text-decoration:none;vertical-align:2px;margin:0 1px}
.acts{display:flex;gap:2px;margin:6px 0 0 -8px;opacity:.0;transition:opacity .2s}
.m:hover .acts,.m.last .acts,.m:focus-within .acts{opacity:1}
.acts button{width:34px;height:34px;border-radius:10px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.acts button:active{background:var(--soft);color:var(--ink)}
.acts svg.i{width:17px;height:17px}
.m.user .acts{margin:4px -8px 0 0}
.think{font-size:13px;color:var(--mute);margin:0 0 8px}
.think summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px}
.think summary::-webkit-details-marker{display:none}
.think div{margin-top:4px;padding-left:10px;border-left:2px solid var(--line)}
.status{display:flex;align-items:center;gap:10px;height:30px;color:var(--mute);font-size:14.5px}
.status .glyph{width:24px;height:24px;flex:none;color:var(--ink);display:block}
.status .word{background:linear-gradient(90deg,var(--mute) 35%,var(--ink) 50%,var(--mute) 65%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.2s linear infinite}
.status .word.fade{animation:shim 2.2s linear infinite,wfade .35s ease}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes wfade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.srcs{display:flex;flex-direction:column;gap:8px;margin:12px 0 2px}
.src{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 13px}
.src:active{background:var(--soft)}
.src .h{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.src .h b{display:inline-flex;min-width:16px;height:16px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:10.5px;align-items:center;justify-content:center;font-weight:700}
.src .t{font-size:14.5px;font-weight:550;color:var(--ink);line-height:1.35}
.src .s{font-size:13px;color:var(--mute);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--mute);margin-top:6px}
/* ---------- komposer ---------- */
.dock{flex:none;padding:6px 12px calc(10px + var(--sab));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.composer{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:8px 8px 8px 8px;display:flex;flex-direction:column;gap:2px}
.composer:focus-within{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:10px;padding:4px 6px 4px 10px;font-size:12.5px;color:var(--mute);max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.chip button{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:9px}
.chip svg.i{width:13px;height:13px}
.banner{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mute);padding:2px 8px 4px 12px}
.row{display:flex;align-items:flex-end;gap:2px}
.row .ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--mute);flex:none}
.row .ib:active{background:var(--soft);color:var(--ink)}
textarea#inp{flex:1;border:0;background:none;resize:none;color:var(--ink);font:16px/1.5 var(--font);padding:9px 6px;max-height:160px;min-height:40px;outline:none}
textarea#inp::placeholder{color:var(--faint)}
#send{width:40px;height:40px;border-radius:20px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;transition:opacity .2s,transform .15s}
#send:active{transform:scale(.94)}
#send[disabled]{opacity:.25}
.stylebar{display:flex;align-items:center;gap:6px;padding:0 4px 0 8px}
.stylebtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);border-radius:999px;padding:4px 10px 4px 8px;border:1px solid transparent}
.stylebtn:active{background:var(--soft)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}
.dot.jujur{background:#b9822b}.dot.toxic{background:var(--danger)}.dot.puitis{background:#5b7fd1}
.webtoggle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);padding:4px 8px;border-radius:999px}
.webtoggle.on{color:var(--accent)}
/* ---------- lembar & menu ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.38);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:40}
.scrim.on{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--bg);border-right:1px solid var(--line);z-index:41;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:var(--sat)}
#drawer.on{transform:none}
#drawer .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
#drawer .top svg{height:20px;width:auto}#drawer .top path{fill:none;stroke:var(--ink);stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;flex-direction:column;padding:4px 8px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:15px;text-align:left;color:var(--ink)}
.nav button.on{background:var(--soft);font-weight:550}.nav button:active{background:var(--soft)}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.hist{flex:1;overflow:auto;padding:4px 8px calc(12px + var(--sab))}
.hist h6{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:12px 12px 6px;font-weight:600}
.hist .it{display:flex;align-items:center;border-radius:12px}
.hist .it button.t{flex:1;text-align:left;padding:9px 12px;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:12px}
.hist .it.on{background:var(--soft)}
.hist .it .x{width:34px;height:34px;color:var(--faint);display:flex;align-items:center;justify-content:center;border-radius:10px}
.hist .it .x svg{width:16px;height:16px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:var(--shadow);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88vh;display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px;flex:none}
.sheet .sh{padding:6px 18px 12px;font-size:17px;font-weight:600;letter-spacing:-.01em;flex:none}
.sheet .sb{overflow:auto;padding:0 12px 14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 10px;border-radius:14px}
.opt:active{background:var(--soft)}
.opt .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.opt b{display:block;font-weight:550;font-size:15px}.opt small{display:block;color:var(--mute);font-size:13px;line-height:1.35}
.opt.on .ic{background:var(--ink);color:var(--bg)}
#reader{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-top:var(--sat)}
#reader.on{transform:none}
#reader .bar{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 6px;border-bottom:1px solid var(--line);flex:none}
#reader .bar .ib{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
#reader .bar .ib:active{background:var(--soft)}
#reader .addr{flex:1;min-width:0;background:var(--soft);border-radius:12px;padding:6px 12px;line-height:1.25}
#reader .addr b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reader .addr small{display:block;font-size:11.5px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reader .body{flex:1;overflow:auto;padding:18px 0 calc(28px + var(--sab));-webkit-overflow-scrolling:touch}
#reader .body h2{font-size:17px;margin:1.3em 0 .4em;letter-spacing:-.01em}
#reader .body .ttl{font-size:25px;line-height:1.25;font-weight:650;letter-spacing:-.02em;margin:0 0 6px}
#reader .body p{margin:0 0 1em;font-size:16.5px;line-height:1.7}
#reader .links{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
#reader .links h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
#reader .links a{display:block;padding:7px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:220% 100%;animation:shim2 1.4s linear infinite;margin:0 0 12px}
@keyframes shim2{from{background-position:120% 0}to{background-position:-120% 0}}
.err{border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--mute);font-size:14.5px;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);font-size:13.5px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- halaman lain ---------- */
.pg{padding:6px 0 calc(30px + var(--sab))}
.pg h1{font-size:26px;font-weight:650;letter-spacing:-.025em;margin:12px 0 4px}
.pg .lead{color:var(--mute);margin:0 0 18px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.kv div b{display:block;font-size:22px;letter-spacing:-.02em;font-weight:620}.kv div span{font-size:12.5px;color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn2{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.btn2:active{background:var(--soft)}
.btn2.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn2[disabled]{opacity:.4}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}.sw small{display:block;color:var(--mute);font-size:13px;line-height:1.35}
.tg{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.tg.on{background:var(--ink)}.tg.on::after{left:21px;background:var(--bg)}
.card textarea,.card input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;color:var(--ink);font:15px/1.5 var(--font);resize:vertical;min-height:90px}
.log{display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--mute)}
.log div{padding-left:12px;border-left:2px solid var(--line);line-height:1.45}
.log div.ok{border-color:#3a9d5d}.log div.no{border-color:var(--danger)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--soft);color:var(--mute)}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.dlg{position:fixed;inset:0;z-index:90;background:rgba(10,10,10,.45);display:flex;align-items:center;justify-content:center;padding:24px;animation:wfade .2s ease}
.dlg .box{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.dlg h4{margin:0 0 6px;font-size:17px;letter-spacing:-.01em}.dlg p{margin:0 0 16px;color:var(--mute);font-size:14.5px;line-height:1.5}.dlg .r{display:flex;gap:8px;justify-content:flex-end}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}.status .glyph *{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 8h16M4 16h10"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zM6 11v1a6 6 0 0 0 12 0v-1M12 18v3"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h10v10H9zM5 15V5h10"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></symbol>

    return t;
  };
  const out = []; let list = null;
  const flush = () => { if (list) { out.push(`<${list.t}>${list.items.join("")}</${list.t}>`); list = null; } };
  for (const para of src.split(/\n{2,}/)) {
    const lines = para.split("\n");
    for (const ln of lines) {

      const cm = ln.match(/^\u0000(\d+)\u0000$/);

      <div class="sw"><span>Hanya saat mengisi daya<small>Hemat baterai</small></span>${tg("tCh", s.only_charging)}</div>
      <div class="sw"><span>Mulai setelah diam<small>detik tanpa obrolan</small></span><select id="sIdle" class="btn2">${[30, 45, 90, 180, 600].map(v => `<option ${v == s.idle_seconds ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="sw"><span>Durasi tiap siklus<small>detik berlatih</small></span><select id="sBud" class="btn2">${[60, 90, 180, 360, 600].map(v => `<option ${v == s.budget_seconds ? "selected" : ""}>${v}</option>`).join("")}</select></div></div>
    <div class="card"><h3>Ajari Weets</h3><textarea id="lesson" placeholder="Tempel teks yang ingin Weets pelajari: catatan, cerita, definisi…"></textarea><div class="btns"><button class="btn2 pri" id="lAdd">Tambahkan materi</button><span style="align-self:center;color:var(--mute);font-size:13px">${s.lessons} materi · ${s.web} teks web</span></div></div>
    <div class="card"><h3>Riwayat</h3><div class="log">${(s.riwayat || []).slice().reverse().map(evLine).join("") || "<div>Belum ada.</div>"}</div></div>`;
    wirePage();
    const save = (o) => api("/api/learn/prefs", o).then(() => toast("Tersimpan")).catch(e => toast(e.message));
    $("#tBg").onclick = () => setBackground($("#tBg").classList.contains("on")).then(draw);
    $("#tEn").onclick = () => save({ enabled: $("#tEn").classList.contains("on") }); $("#tCh").onclick = () => save({ only_charging: $("#tCh").classList.contains("on") });
    $("#sIdle").onchange = e => save({ idle_seconds: +e.target.value }); $("#sBud").onchange = e => save({ budget_seconds: +e.target.value });
    $("#lNow").onclick = () => api("/api/learn/now", {}).then(() => { toast("Mulai belajar"); setTimeout(draw, 800); }); $("#lGrow").onclick = () => api("/api/learn/now", { grow: true }).then(() => toast("Mencoba tumbuh; hasilnya diuji dulu"));
    $("#lBack").onclick = async () => { if (await ask("Kembali ke versi sebelumnya?", "Hasil belajar terakhir akan dibuang.", "Kembalikan")) api("/api/learn/rollback", {}).then(r => { toast(r.ok ? "Dikembalikan" : "Tidak ada cadangan"); draw(); }); };
    $("#lAdd").onclick = () => { const v = $("#lesson").value.trim(); if (v.length < 8) return toast("Terlalu pendek"); api("/api/learn/lesson", { text: v }).then(() => { toast("Materi ditambahkan; Weets akan segera mempelajarinya"); $("#lesson").value = ""; draw(); }).catch(e => toast(e.message)); };
  };
  await draw(); poll = setInterval(() => { if (!document.activeElement || document.activeElement.id !== "lesson") draw(); }, 5000);
}
async function renderModel() {
  $("#view").innerHTML = `<div class="page"><div class="wrap pg"><h1>Model</h1><p class="lead">Bobot Weets disimpan di ponselmu. Ekspor sebagai .wt untuk cadangan atau pindah perangkat.</p><div id="mBox"></div></div></div>`;
  let st; try { st = await api("/api/status"); } catch (e) { $("#mBox").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const m = st.model || {};
  $("#mBox").innerHTML = `<div class="card"><h3>Arsitektur</h3><div class="kv"><div><b>${fmt(m.params)}</b><span>parameter</span></div><div><b>${fmt(m.vocab)}</b><span>token = kata</span></div><div><b>${m.layers ?? "–"}</b><span>lapisan</span></div><div><b>${m.width ?? "–"}</b><span>lebar</span></div><div><b>${fmt(m.mlp)}</b><span>unit MLP</span></div><div><b>${fmt(m.step)}</b><span>langkah latih</span></div></div></div>
  <div class="card"><h3>Berkas .wt</h3><div class="btns"><button class="btn2 pri" id="xp">${ico("dl")}Ekspor</button><button class="btn2" id="xl">${ico("dl")}Ekspor ringan</button><button class="btn2" id="im">${ico("ul")}Impor .wt</button></div><p style="color:var(--mute);font-size:13px;margin:12px 0 0">Ekspor ringan membuang keadaan optimizer, ukurannya sekitar sepertiga. Impor hanya menerima model Weets bertokenizer per kata.</p><input type="file" id="wtIn" class="hide" accept=".wt"></div>
  <div class="card"><h3>Tentang</h3><div class="log"><div>Weets ${esc(st.versi_app)} · NumPy murni · tanpa model orang lain.</div><div>Pengetahuan dunia datang dari web, bukan dari hafalan model.</div></div></div>`;
  const dl = async (light) => { try { const r = await fetch("/api/model/export" + (light ? "?optimizer=0" : "")); if (!r.ok) throw new Error((await r.json()).error); const b = await r.blob(); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `weets-${new Date().toISOString().slice(0, 10)}.wt`; document.body.appendChild(a); a.click(); a.remove(); toast("Berkas .wt disiapkan"); } catch (e) { toast(e.message); } };
  $("#xp").onclick = () => dl(false); $("#xl").onclick = () => dl(true); $("#im").onclick = () => $("#wtIn").click();
  $("#wtIn").onchange = async e => { const f = e.target.files[0]; if (!f) return; if (!(await ask("Ganti model?", "Model saat ini akan diganti dengan " + f.name + ".", "Ganti"))) return; try { const r = await fetch("/api/model/import", { method: "POST", body: await f.arrayBuffer() }); const j = await r.json(); if (!r.ok) throw new Error(j.error); toast("Model diganti"); renderModel(); } catch (er) { toast(er.message, 4200); } };
}
async function renderSettings() {
  const st = await api("/api/status").catch(() => ({}));
  const bgOn = (await api("/api/learn/status").catch(() => ({}))).background === true;
  $("#view").innerHTML = `<div class="page"><div class="wrap pg"><h1>Pengaturan</h1><p class="lead">Tampilan, suara, dan koneksi.</p>
  <div class="card"><h3>Tampilan</h3><div class="sw"><span>Tema</span><select id="sTheme" class="btn2">${[["auto", "Otomatis"], ["light", "Terang"], ["dark", "Gelap"]].map(([k, t]) => `<option value="${k}" ${theme() === k ? "selected" : ""}>${t}</option>`).join("")}</select></div>
  <div class="sw"><span>Gaya bawaan</span><select id="sStyle" class="btn2">${Object.entries(STYLE_INFO).map(([k, [t]]) => `<option value="${k}" ${style === k ? "selected" : ""}>${t}</option>`).join("")}</select></div></div>
  <div class="card"><h3>Suara</h3><div class="sw"><span>Bacakan jawaban otomatis<small>Memakai suara Indonesia bawaan ponsel. Bukan suara Weets sendiri.</small></span>${tg("tSpeak", store.get("autospeak", false))}</div></div>
  <div class="card"><h3>Koneksi</h3><div class="sw"><span>Pencarian web bawaan<small>${web ? "aktif" : "mati"} · tanpa kunci API</small></span>${tg("tWeb", web)}</div><div class="btns"><button class="btn2" id="bDiag">${ico("globe")}Tes koneksi</button></div><div class="log" id="dOut" style="margin-top:12px"></div></div>
  <div class="card"><h3>Perangkat</h3><div class="sw" style="border:0;padding-top:0"><span>Belajar di latar belakang<small>Bisa dibatalkan kapan saja</small></span>${tg("tBg2", bgOn)}</div><div class="btns"><button class="btn2" id="bBat">Izinkan belajar di latar belakang</button><button class="btn2" id="bNot">Tes notifikasi</button></div></div>
  <div class="card"><h3>Data</h3><div class="btns"><button class="btn2" id="bClr" style="color:var(--danger)">${ico("trash")}Hapus semua obrolan</button></div></div></div></div>`;
  wirePage();
  $("#sTheme").onchange = e => { store.set("theme", e.target.value); applyTheme(); };
  $("#sStyle").onchange = async e => { const k = e.target.value; if (k === "toxic" && !store.get("toxicOk", false) && !(await ask("Mode Kasar", "Weets akan mengumpat pada kebiasaan dan alasanmu, bukan pada dirimu. Jangan pakai saat kamu sedang rapuh.", "Aktifkan"))) { e.target.value = style; return; } if (k === "toxic") store.set("toxicOk", true); style = k; store.set("style", k); };
  $("#tSpeak").onclick = () => store.set("autospeak", $("#tSpeak").classList.contains("on")); $("#tWeb").onclick = () => { web = $("#tWeb").classList.contains("on"); store.set("web", web); };
  $("#tBg2").onclick = () => setBackground($("#tBg2").classList.contains("on")).then(r => { if (r && !r.on && $("#tBg2").classList.contains("on")) $("#tBg2").classList.remove("on"); });
  $("#bDiag").onclick = async () => { $("#dOut").innerHTML = "<div>Memeriksa…</div>"; try { const d = await api("/api/diag"); $("#dOut").innerHTML = d.jaringan.map(x => `<div class="${x.ok ? "ok" : "no"}"><b>${esc(x.situs)}</b> · ${x.ok ? "terhubung (" + x.ms + " ms)" : "gagal: " + esc(x.sebab) + " — " + esc(x.detail || "")}</div>`).join("") + `<div>Baterai ${d.baterai.level}%${d.baterai.charging ? " · mengisi daya" : ""}</div>`; } catch (e) { $("#dOut").innerHTML = `<div class="no">${esc(e.message)}</div>`; } };
  $("#bBat").onclick = () => api("/api/battery", {}).then(r => toast(r.sudah ? "Sudah diizinkan" : r.ok ? "Pilih “Izinkan” di layar berikutnya" : (r.alasan || "Tidak tersedia"))); $("#bNot").onclick = () => api("/api/notify", { title: "Weets", text: "Notifikasi berfungsi." }).then(r => toast(r.ok ? "Terkirim" : "Notifikasi tidak tersedia di sini"));
  $("#bClr").onclick = async () => { if (await ask("Hapus semua obrolan?", "Riwayat di perangkat ini akan hilang.", "Hapus")) { chats = []; cur = null; store.set("chats", []); toast("Dihapus"); } };
}

/* ================= boot: splash "Weets" -> animasi logo -> aplikasi ================= */
(function boot() {
  applyTheme();
  const ll = $("#logoLoad"); ll.setAttribute("viewBox", `-40 -40 ${LOGO.w + 80} ${LOGO.h + 80}`);
  ll.innerHTML = `<path class="ghost" d="${LOGO.d}" stroke-width="60"/><path class="flow" pathLength="1" d="${LOGO.d}" stroke-width="60"/>`;
  history.replaceState({ l: 0 }, ""); go("chat");
  const t0 = Date.now(), up = fetch("/api/status").then(r => r.json()).catch(() => null);
  setTimeout(async () => {
    $("#splash").classList.add("out"); $("#loading").classList.remove("out");
    $("#loadNote").textContent = "Menyiapkan Weets";
    const st = await Promise.race([up, new Promise(r => setTimeout(r, 9000, "timeout"))]);
    if (st === "timeout" || !st) $("#loadNote").textContent = "Server belum menjawab, mencoba lagi…";
    else if (st.model && !st.model.ready) $("#loadNote").textContent = "Model belum ada: impor .wt di halaman Model";
    const wait = Math.max(0, 2900 - (Date.now() - t0)); await new Promise(r => setTimeout(r, wait));
    $("#loading").classList.add("out");
    try { const ls = await api("/api/learn/status"); if (ls.background === null && !store.get("bgAsked", false)) setTimeout(askBackground, 900); } catch { }
  }, 2100);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeTop(); });
})();

</script>
